<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width,initial-scale=1.0">
	<title>UCC Admin | Forgot Password</title>
	<link rel="icon" type="image/png" href="images/ucc-LOGO.png">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Libre+Baskerville:wght@700&display=swap" rel="stylesheet">
	<script src="https://unpkg.com/lucide@latest"></script>
	<link rel="stylesheet" href="style.css">
</head>

<body class="login-page">

<div class="login-grid">

	<div class="login-brand">

		<div class="brand-content">

			<img src="images/ucc-LOGO.png" alt="UCC Logo">

			<h1>UCC Admin</h1>

			<p>University of Caloocan City</p>

			<span>PUBLIC SERVICE THROUGH QUALITY EDUCATION</span>

		</div>

	</div>

	<div class="login-side">

		<div class="top-slogan">
			A BRIGHTER CALOOCAN
			<br>
			THROUGH HIGHER LEARNING
			<div class="slogan-line"></div>
		</div>

		<div class="login-card">

			<div class="login-header">

				<div class="login-top-icon">
					<i data-lucide="mail"></i>
				</div>

				<h2>Forgot Password?</h2>

			</div>

			<p>Enter your email address and we'll send you a link to reset your password.</p>

			<form class="login-form">

				<div class="input-group">

					<label>Email Address</label>

					<div class="input-box">
						<i data-lucide="mail"></i>
						<input type="email" placeholder="Enter your email address">
					</div>

				</div>

				<button type="submit" class="login-btn">
					Send Reset Link
					<i data-lucide="arrow-right"></i>
				</button>

			</form>

			<a href="Login.html" class="back-login">
				<i data-lucide="arrow-left"></i>
				Back to Login
			</a>

			<div class="login-footer">
				<div class="footer-line"></div>
				<span>Secure Access • UCC Administration System</span>
			</div>

		</div>

	</div>

</div>

<script>
	lucide.createIcons();
</script>

</body>
</html>
